<style>
.kig-map-pulse{animation:kigMapPulse 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.kig-map-blink{animation:kigMapBlink 1.8s steps(1) infinite}
@keyframes kigMapPulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes kigMapBlink{0%,60%{opacity:1}61%,100%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.kig-map-pulse,.kig-map-blink{animation:none}}
</style>
